# BandBook on Cloudflare: the app and the band's data in one Worker.
# `node worker/setup.mjs` fills in the two ids below and deploys.
name = "bandbook"
main = "worker/index.js"
compatibility_date = "2025-01-01"

[vars]
BAND_NAME = "Enna White"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "bandbook"
database_id = "aa302e10-e52c-4d8d-adc0-e09775ef3a11"

[[kv_namespaces]]
binding = "FILES"
id = "b341425cd3574e0aa7d9211ba4abf7bb"
